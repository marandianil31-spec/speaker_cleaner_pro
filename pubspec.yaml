
name: speaker_cleaner_pro
description: Speaker Cleaner Pro - Speaker cleaning and frequency test utility
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "speaker_cleaner_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#081116"
  adaptive_icon_foreground: "speaker_cleaner_icon.png"
  

name: Build Speaker Cleaner Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android Project
        run: flutter create --platforms=android .

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Check Android SDK Versions
        run: |
          echo "========== ANDROID APP GRADLE =========="

          if [ -f android/app/build.gradle.kts ]; then
            cat android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            cat android/app/build.gradle
          fi

          echo "========== ANDROID SDK VALUES =========="

          grep -n -E "minSdk|compileSdk|targetSdk" \
            android/app/build.gradle* || true

          echo "========== FLUTTER VERSION =========="
          flutter --version

          echo "========== JAVA VERSION =========="
          java -version

      - name: Check AdMob Dependencies
        run: |
          echo "========== GOOGLE MOBILE ADS =========="

          grep -n "google_mobile_ads" pubspec.yaml || true

          echo "========== WORKMANAGER =========="

          cd android

          ./gradlew :app:dependencyInsight \
            --configuration releaseRuntimeClasspath \
            --dependency androidx.work:work-runtime || true

          echo "========== ROOM =========="

          ./gradlew :app:dependencyInsight \
            --configuration releaseRuntimeClasspath \
            --dependency androidx.room:room-runtime || true

      - name: Check Required Files
        run: |
          test -f assets/audio/sweep.wav
          test -f speaker_cleaner_icon.png

          echo "Required files found."

      - name: Generate Android App Icon
        run: dart run flutter_launcher_icons

      - name: Analyze Flutter Code
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Speaker-Cleaner-Pro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          

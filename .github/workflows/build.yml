
name: Build Speaker Cleaner Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check app files
        run: |
          test -f lib/main.dart
          test -f assets/audio/tone_165.wav
          test -f assets/audio/sweep.wav
          test -f speaker_cleaner_icon.png

      - name: Generate Android project
        run: flutter create . --platforms=android --project-name=speaker_cleaner_pro

      - name: Get dependencies
        run: flutter pub get

      - name: Configure AdMob App ID
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()

          app_id = (
              '<meta-data '
              'android:name="com.google.android.gms.ads.APPLICATION_ID" '
              'android:value="ca-app-pub-6724668039220554~8020469476" />'
          )

          if "com.google.android.gms.ads.APPLICATION_ID" not in content:
              if "</application>" not in content:
                  raise SystemExit("Android application tag not found")
              content = content.replace(
                  "</application>",
                  "        " + app_id + "\n    </application>"
              )
              path.write_text(content)

          print("AdMob App ID configured")
          PY

      - name: Set app icon
        run: |
          dart pub global activate flutter_launcher_icons
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "speaker_cleaner_icon.png"
            min_sdk_android: 21
            adaptive_icon_background: "#081116"
            adaptive_icon_foreground: "speaker_cleaner_icon.png"
          EOF
          dart pub global run flutter_launcher_icons

      - name: Analyze code
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: speaker-cleaner-pro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          

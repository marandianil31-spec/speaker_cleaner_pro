name: Build Speaker Cleaner Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check required project files
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f assets/audio/sweep.wav
          test -f speaker_cleaner_icon.png

      - name: Generate Frequency Audio Files
        run: |
          python3 - <<'PY'
          import math
          import wave
          import struct
          from pathlib import Path

          folder = Path("assets/audio")
          folder.mkdir(parents=True, exist_ok=True)

          sample_rate = 44100
          duration = 3
          frequencies = [60, 80, 100, 165, 250, 500, 1000, 2000, 4000]

          for freq in frequencies:
              path = folder / f"tone_{freq}.wav"

              with wave.open(str(path), "wb") as wav:
                  wav.setnchannels(1)
                  wav.setsampwidth(2)
                  wav.setframerate(sample_rate)

                  frames = bytearray()
                  total = sample_rate * duration

                  for i in range(total):
                      fade = min(1.0, i / 500, (total - i) / 500)
                      value = int(
                          5000 * fade *
                          math.sin(2 * math.pi * freq * i / sample_rate)
                      )
                      frames.extend(struct.pack("<h", value))

                  wav.writeframes(frames)

          print("Frequency audio files generated successfully.")
          PY

      - name: Generate Android project
        run: flutter create . --platforms=android --project-name=speaker_cleaner_pro

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Set Android App Icon
        run: |
          dart pub global activate flutter_launcher_icons

          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "speaker_cleaner_icon.png"
            adaptive_icon_background: "#081116"
            adaptive_icon_foreground: "speaker_cleaner_icon.png"
          EOF

          dart pub global run flutter_launcher_icons

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: speaker-cleaner-pro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          

name: Build Speaker Cleaner Pro

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter Project
        run: |
          flutter create --platforms=android --org com.soundx.cleaner app

      - name: Create Flutter App
        working-directory: app
        shell: bash
        run: |
          cat > lib/main.dart <<'DART'
          import 'dart:async';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const SpeakerCleanerApp());
          }

          class SpeakerCleanerApp extends StatelessWidget {
            const SpeakerCleanerApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Speaker Cleaner Pro',
                theme: ThemeData(
                  brightness: Brightness.dark,
                  useMaterial3: true,
                  scaffoldBackgroundColor: const Color(0xFF10121C),
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: const Color(0xFF00E5FF),
                    brightness: Brightness.dark,
                  ),
                ),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen>
              with SingleTickerProviderStateMixin {
            static const audio = MethodChannel('speaker_cleaner/audio');

            bool playing = false;
            bool vibrationRunning = false;

            double frequency = 150;
            int duration = 30;
            int remaining = 0;

            String status = 'Ready to test';

            Timer? timer;
            AnimationController? animation;

            @override
            void initState() {
              super.initState();

              animation = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 700),
              )..repeat(reverse: true);
            }

            Future<void> startSound() async {
              timer?.cancel();

              try {
                await audio.invokeMethod('startTone', {
                  'frequency': frequency,
                });

                if (!mounted) return;

                setState(() {
                  playing = true;
                  remaining = duration;
                  status = 'Sound test running';
                });

                timer = Timer.periodic(
                  const Duration(seconds: 1),
                  (t) {
                    if (!mounted) {
                      t.cancel();
                      return;
                    }

                    if (remaining <= 1) {
                      stopSound();
                    } else {
                      setState(() => remaining--);
                    }
                  },
                );
              } catch (_) {
                if (!mounted) return;
                setState(() {
                  playing = false;
                  status = 'Unable to play sound';
                });
              }
            }

            Future<void> stopSound() async {
              timer?.cancel();
              timer = null;

              try {
                await audio.invokeMethod('stopTone');
              } catch (_) {}

              if (!mounted) return;

              setState(() {
                playing = false;
                remaining = 0;
                status = 'Ready to test';
              });
            }

            Future<void> vibrationTest(String mode) async {
              if (vibrationRunning) return;

              setState(() {
                vibrationRunning = true;
                status = mode == 'long'
                    ? 'Long vibration test'
                    : 'Pulse vibration test';
              });

              try {
                await audio.invokeMethod('vibrate', {
                  'mode': mode,
                });
              } catch (_) {
                if (mounted) {
                  setState(() {
                    status = 'Vibration unavailable';
                  });
                }
              }

              await Future.delayed(
                Duration(seconds: mode == 'long' ? 3 : 2),
              );

              if (!mounted) return;

              setState(() {
                vibrationRunning = false;
                status = 'Ready to test';
              });
            }

            Widget modeButton(
              String title,
              int hz,
              IconData icon,
            ) {
              final selected = frequency == hz.toDouble();

              return Expanded(
                child: Padding(
                  padding: const EdgeInsets.symmetric(horizontal: 4),
                  child: InkWell(
                    borderRadius: BorderRadius.circular(16),
                    onTap: playing
                        ? null
                        : () {
                            setState(() {
                              frequency = hz.toDouble();
                              status = '$title mode selected';
                            });
                          },
                    child: Container(
                      padding: const EdgeInsets.symmetric(vertical: 14),
                      decoration: BoxDecoration(
                        color: selected
                            ? const Color(0xFF174353)
                            : const Color(0xFF1B2030),
                        borderRadius: BorderRadius.circular(16),
                        border: Border.all(
                          color: selected
                              ? const Color(0xFF00E5FF)
                              : Colors.white12,
                        ),
                      ),
                      child: Column(
                        children: [
                          Icon(icon, color: const Color(0xFF00E5FF)),
                          const SizedBox(height: 6),
                          Text(title, style: const TextStyle(fontSize: 12)),
                          Text(
                            '$hz Hz',
                            style: const TextStyle(
                              fontSize: 11,
                              color: Colors.white60,
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }

            Widget toolCard(
              IconData icon,
              String title,
              String subtitle,
              VoidCallback onTap,
            ) {
              return Card(
                color: const Color(0xFF1B2030),
                margin: const EdgeInsets.only(bottom: 12),
                child: ListTile(
                  contentPadding: const EdgeInsets.all(12),
                  leading: CircleAvatar(
                    backgroundColor: const Color(0xFF26394A),
                    child: Icon(
                      icon,
                      color: const Color(0xFF00E5FF),
                    ),
                  ),
                  title: Text(
                    title,
                    style: const TextStyle(fontWeight: FontWeight.bold),
                  ),
                  subtitle: Text(subtitle),
                  trailing: const Icon(Icons.arrow_forward_ios, size: 16),
                  onTap: onTap,
                ),
              );
            }

            @override
            void dispose() {
              timer?.cancel();
              audio.invokeMethod('stopTone').catchError((_) {});
              animation?.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text(
                    'Speaker Cleaner Pro',
                    style: TextStyle(fontWeight: FontWeight.bold),
                  ),
                  centerTitle: true,
                  backgroundColor: const Color(0xFF10121C),
                ),
                body: SafeArea(
                  child: ListView(
                    padding: const EdgeInsets.all(18),
                    children: [
                      Container(
                        padding: const EdgeInsets.all(22),
                        decoration: BoxDecoration(
                          gradient: const LinearGradient(
                            colors: [
                              Color(0xFF18384B),
                              Color(0xFF20213C),
                            ],
                          ),
                          borderRadius: BorderRadius.circular(28),
                        ),
                        child: Column(
                          children: [
                            AnimatedBuilder(
                              animation: animation!,
                              builder: (context, child) {
                                return Transform.scale(
                                  scale: playing
                                      ? 1 + animation!.value * 0.12
                                      : 1,
                                  child: child,
                                );
                              },
                              child: const Icon(
                                Icons.graphic_eq,
                                size: 76,
                                color: Color(0xFF00E5FF),
                              ),
                            ),
                            const SizedBox(height: 12),
                            const Text(
                              'Sound Check',
                              style: TextStyle(
                                fontSize: 26,
                                fontWeight: FontWeight.bold,
                              ),
                            ),
                            const SizedBox(height: 8),
                            Text(status),
                            const SizedBox(height: 18),
                            Text(
                              '${frequency.round()} Hz',
                              style: const TextStyle(
                                fontSize: 32,
                                fontWeight: FontWeight.bold,
                              ),
                            ),
                            Slider(
                              value: frequency,
                              min: 100,
                              max: 1000,
                              divisions: 18,
                              onChanged: playing
                                  ? null
                                  : (v) {
                                      setState(() => frequency = v);
                                    },
                            ),
                            DropdownButtonFormField<int>(
                              value: duration,
                              decoration: const InputDecoration(
                                labelText: 'Auto Stop',
                                border: OutlineInputBorder(),
                              ),
                              items: const [
                                DropdownMenuItem(
                                  value: 30,
                                  child: Text('30 seconds'),
                                ),
                                DropdownMenuItem(
                                  value: 60,
                                  child: Text('1 minute'),
                                ),
                                DropdownMenuItem(
                                  value: 120,
                                  child: Text('2 minutes'),
                                ),
                              ],
                              onChanged: playing
                                  ? null
                                  : (v) {
                                      if (v != null) {
                                        setState(() => duration = v);
                                      }
                                    },
                            ),
                            const SizedBox(height: 18),
                            if (playing)
                              Text('Stopping in $remaining seconds'),
                            const SizedBox(height: 10),
                            SizedBox(
                              width: double.infinity,
                              height: 54,
                              child: FilledButton.icon(
                                onPressed: playing ? stopSound : startSound,
                                icon: Icon(
                                  playing ? Icons.stop : Icons.play_arrow,
                                ),
                                label: Text(
                                  playing ? 'STOP SOUND' : 'START TEST',
                                ),
                              ),
                            ),
                          ],
                        ),
                      ),
                      const SizedBox(height: 24),
                      const Text(
                        'SOUND MODES',
                        style: TextStyle(
                          color: Color(0xFF00E5FF),
                          fontWeight: FontWeight.bold,
                          letterSpacing: 2,
                        ),
                      ),
                      const SizedBox(height: 12),
                      Row(
                        children: [
                          modeButton('Low', 150, Icons.graphic_eq),
                          modeButton('Medium', 400, Icons.multitrack_audio),
                          modeButton('High', 800, Icons.equalizer),
                        ],
                      ),
                      const SizedBox(height: 24),
                      const Text(
                        'VIBRATION TEST',
                        style: TextStyle(
                          color: Color(0xFF00E5FF),
                          fontWeight: FontWeight.bold,
                          letterSpacing: 2,
                        ),
                      ),
                      const SizedBox(height: 12),
                      toolCard(
                        Icons.vibration,
                        'Long Vibration',
                        'One continuous vibration for about 3 seconds',
                        () => vibrationTest('long'),
                      ),
                      toolCard(
                        Icons.vibration,
                        'Pulse Vibration',
                        'Three short vibration pulses',
                        () => vibrationTest('pulse'),
                      ),
                      toolCard(
                        Icons.volume_up,
                        'Speaker Test',
                        'Select 400 Hz and start the sound test',
                        () {
                          if (playing) {
                            stopSound();
                          }
                          setState(() {
                            frequency = 400;
                            status = 'Speaker test selected';
                          });
                        },
                      ),
                      toolCard(
                        Icons.cleaning_services,
                        'Speaker Cleaner',
                        'Select 150 Hz and start the sound test',
                        () {
                          if (playing) {
                            stopSound();
                          }
                          setState(() {
                            frequency = 150;
                            status = 'Cleaner mode selected';
                          });
                        },
                      ),
                      toolCard(
                        Icons.info_outline,
                        'About',
                        'Speaker Cleaner Pro v1.2',
                        () {
                          showAboutDialog(
                            context: context,
                            applicationName: 'Speaker Cleaner Pro',
                            applicationVersion: '1.2.0',
                            applicationLegalese:
                                'Sound cannot guarantee water removal.',
                          );
                        },
                      ),
                      const SizedBox(height: 12),
                      const Text(
                        'Safety: Keep volume moderate. Avoid prolonged loud '
                        'sounds. Vibration patterns do not increase motor '
                        'strength. This app cannot guarantee water removal.',
                        textAlign: TextAlign.center,
                        style: TextStyle(
                          color: Colors.white60,
                          fontSize: 12,
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          DART

      - name: Configure Android
        working-directory: app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permission = (
              '    <uses-permission '
              'android:name="android.permission.VIBRATE"/>\n'
          )

          if 'android.permission.VIBRATE' not in text:
              text = text.replace(
                  '<application',
                  permission + '    <application',
                  1
              )

          manifest.write_text(text)

          kotlin = Path(
              "android/app/src/main/kotlin/"
              "com/soundx/cleaner/app/MainActivity.kt"
          )
          kotlin.parent.mkdir(parents=True, exist_ok=True)

          kotlin.write_text('''package com.soundx.cleaner.app

          import android.content.Context
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import android.os.Build
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
